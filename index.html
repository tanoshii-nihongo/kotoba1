<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ことばカード 初級1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f3f0fb; --bg2:#e8f3f6;
  --card:#ffffff; --ink:#2d2a3a; --sub:#7a7690;
  --accent:#6b7fd7; --accent-soft:#e6eafb;
  --good:#23735c; --good-soft:#e2f4ee;
  --again:#b83a58; --again-soft:#fbe8ec;
  --line:#2d2a3a; --shadow:0 10px 30px rgba(70,60,120,.12);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Nunito","Klee One",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));}
.jp{font-family:"Klee One",serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin-bottom:16px}
header h1{font-family:"Klee One",serif;font-weight:600;font-size:1.5rem;margin:6px 0 2px;letter-spacing:.05em}
header p{margin:0;color:var(--sub);font-size:.9rem}

/* lock screen */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));z-index:10;padding:16px}
#lock .box{background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);width:100%;max-width:340px;text-align:center}
#lock h2{font-family:"Klee One",serif;margin:0 0 6px;font-size:1.3rem}
#lock p{color:var(--sub);font-size:.9rem;margin:0 0 16px}
#lock input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #d8d5e6;font-size:1rem;font-family:inherit;outline:none}
#lock input:focus{border-color:var(--accent)}
#lock .err{color:var(--again);font-size:.85rem;min-height:1.2em;margin-top:8px}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
select,.btn{font-family:inherit;font-size:.92rem;border-radius:999px;border:1.5px solid transparent;padding:8px 14px;cursor:pointer}
select{background:var(--card);border-color:#ddd9ea;color:var(--ink)}
.btn{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(70,60,120,.08)}
.btn.on{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.progress{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--sub);margin:4px 2px 12px}
.bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fa0e8,#7cc7c2);transition:width .3s}

/* card */
.scene{perspective:1200px;cursor:pointer;user-select:none}
.card{position:relative;height:360px;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.tag{position:absolute;top:14px;left:16px;font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
.hint{position:absolute;bottom:12px;font-size:.8rem;color:#8a86a0}
.en{font-size:2.1rem;font-weight:700;line-height:1.3}
.en.long{font-size:1.65rem}
.note{font-size:1.15rem;color:#5a566f;margin-top:14px;line-height:1.5}

/* Japanese face */
.jpmain{font-family:"Klee One",serif;font-weight:600;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.jpmain.xl{font-size:4.2rem}
.jpmain.lg{font-size:3rem}
.jpmain.md{font-size:2.1rem}
.kana{font-family:"Klee One",serif;font-size:1.9rem;color:#46425a;font-weight:600;margin-top:16px;word-break:keep-all}
.kana.long{font-size:1.35rem}
.ex{word-break:keep-all;overflow-wrap:anywhere;font-family:"Klee One",serif;font-weight:600;font-size:1.2rem;color:var(--ink);margin-top:16px;padding:8px 14px;border-radius:12px;background:var(--accent-soft);line-height:1.5}
.exe{font-size:1.05rem;color:#46425a;margin-top:16px;padding:8px 14px;border-radius:12px;background:var(--accent-soft);line-height:1.5}
.pill{position:absolute;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.85rem;font-weight:700;color:#fff;background:var(--accent);padding:4px 12px;border-radius:99px}
.sent{font-family:"Klee One",serif;font-weight:600;font-size:1.45rem;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;margin-top:6px}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--accent);color:var(--accent);margin:0 .15em}
.fill{color:var(--good);border-bottom:3px solid var(--good);margin:0 .15em;padding:0 .1em}
.romaji{font-size:1.05rem;color:#5a566f;margin-top:6px;letter-spacing:.03em}

/* answer buttons */
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.answer button{font-family:inherit;font-size:1.15rem;font-weight:700;border:none;border-radius:16px;padding:16px 10px;cursor:pointer;color:#fff;box-shadow:0 4px 12px rgba(40,30,80,.15);letter-spacing:.02em}
.again{background:var(--again)}
.good{background:var(--good)}
.answer small{display:block;font-family:"Klee One",serif;font-weight:600;font-size:.95rem;margin-top:2px}

/* level badge + locked panel */
.level{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:700;color:var(--accent);background:var(--card);padding:4px 12px;border-radius:99px;box-shadow:0 2px 6px rgba(70,60,120,.08)}
.locked{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:30px 22px;text-align:center}
.locked .lockicon{font-size:2.6rem}
.locked h2{font-family:"Klee One",serif;margin:6px 0 8px;font-size:1.4rem}
.locked p{color:#5a566f;margin:0 0 18px;line-height:1.6;font-size:1.05rem}
.locked input{width:100%;max-width:280px;padding:12px 14px;border-radius:12px;border:1.5px solid #d8d5e6;font-size:1rem;font-family:inherit;outline:none;display:block;margin:0 auto}
.locked input:focus{border-color:var(--accent)}
.locked .err{color:var(--again);font-size:.9rem;min-height:1.3em;margin:8px 0}

/* done */
.done{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:30px 22px;text-align:center}
.done h2{font-family:"Klee One",serif;margin:0 0 8px}
.done p{color:var(--sub);margin:0 0 18px}
.done .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.keys{text-align:center;color:#6f6b85;font-size:.8rem;margin-top:14px}
@media (max-width:420px){ .jpmain.xl{font-size:3.6rem} .jpmain.lg{font-size:2.5rem} .jpmain.md{font-size:1.8rem} .kana{font-size:1.6rem} .kana.long{font-size:1.2rem} .en{font-size:1.85rem} .en.long{font-size:1.5rem} .note{font-size:1.05rem} }
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <h2>ことばカード <span class="siteName"></span></h2>
    <p>Enter the password from your teacher.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn on" style="margin-top:8px;width:100%" id="enter">Enter</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <h1>ことばカード <span id="siteName"></span></h1>
    <p>Minna no Nihongo Vocabulary</p>
    <div class="level" id="levelBadge"></div>
  </header>

  <div class="controls">
    <select id="lesson"></select>
    <button class="btn on" id="mEJ">English → 日本語</button>
    <button class="btn" id="mJE">日本語 → English</button>
    <button class="btn" id="shuffle">🔀 Shuffle</button>
  </div>

  <div class="progress"><span id="count"></span><div class="bar"><i id="barfill"></i></div><span id="known"></span></div>

  <div id="study">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="answer">
      <button class="again" id="again">✗ Still learning<small>まだ</small></button>
      <button class="good" id="good">✓ Got it!<small>おぼえた</small></button>
    </div>
    <div class="keys">Tap the card to flip · Keyboard: Space = flip, ← still learning, → got it</div>
  </div>

  <div class="locked" id="locked" hidden>
    <div class="lockicon">🔒</div>
    <h2 id="lockTitle"></h2>
    <p id="lockText"></p>
    <input id="pw2" type="password" placeholder="New password" autocomplete="off">
    <div class="err" id="err2"></div>
    <button class="btn on" id="unlock2">Unlock</button>
  </div>

  <div class="done" id="done" hidden>
    <h2>おつかれさまでした！</h2>
    <p id="result"></p>
    <div class="row">
      <button class="btn on" id="review">Review “still learning” cards</button>
      <button class="btn" id="restart">Start over</button>
    </div>
  </div>
</div>

<script>
/* ===== Levels & passwords =====
   A simple "keep out" gate, not real security.
   Each level's password opens that level AND every level before it.
   To change a password, replace its hash (ask Claude to make a new one). */
const SITE_NAME = "初級1";   // shown in the title. 初級2 site: "初級2"
const SITE_ID = "shokyu1";   // keeps each site's saved data separate. 初級2 site: "shokyu2"
const LEVELS = [
  {name:"初級1-1", from:1,  to:13, hash:"652b04df"},
  {name:"初級1-2", from:14, to:25, hash:"f081b05a"}
];
/* 初級2 site uses:
  {name:"初級2-1", from:26, to:37, hash:"(new hash)"},
  {name:"初級2-2", from:38, to:50, hash:"(new hash)"}
*/
let level=-1; // highest unlocked level (index in LEVELS)
function levelOfLesson(n){return LEVELS.findIndex(l=>n>=l.from&&n<=l.to)}
function isOpen(n){return levelOfLesson(n)<=level}
function levelFromPw(pw){return LEVELS.findIndex(l=>l.hash===hash(pw.trim()))}
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}

function toRomaji(str){
  const h=[...str].map(c=>{const n=c.codePointAt(0);return n>=0x30a1&&n<=0x30f6?String.fromCodePoint(n-0x60):c}).join("");
  let out="",i=0;
  while(i<h.length){
    const two=h.slice(i,i+2),c=h[i];
    let r=null,step=1;
    if(R2[two]){r=R2[two];step=2}else if(R1[c]!==undefined){r=R1[c]}

    if(c==="ん"){const nx=R2[h.slice(i+1,i+3)]||R1[h[i+1]]||"";out+=/^[aeiouy]/.test(nx)?"n'":"n";i++;continue}
    if(r!==null){out+=r;i+=step;continue}
    out+=({"～":"~","。":"","、":", ","？":"?","　":" ","（":" (","）":")","……":"…","…":"…"})[c]??c;i++;
  }
  return out.replace(/(\S)(desu|deshita)/g,"$1 $2").replace(/(desu|deshita|masu|mashita)(ka|ne|yo)\b/g,"$1 $2").replace(/\s+/g," ").trim();
}

    [7,"これから","これから ばんごはんを たべます。","I'm going to have dinner now."],
    [8,"とても","この くだものは とても おいしいです。","This fruit is very delicious."],
    [8,"あまり","きょうは あまり さむくないです。","It isn't very cold today."],
    [9,"よく","にほんごが よく わかります。","I understand Japanese well."],
    [9,"だいたい","カタカナが だいたい わかります。","I mostly understand katakana."],
    [9,"たくさん","しゅくだいが たくさん あります。","I have a lot of homework."],
    [9,"すこし","かんじが すこし わかります。","I understand a little kanji."],
    [9,"ぜんぜん","フランスごが ぜんぜん わかりません。","I don't understand French at all."],
    [9,"はやく","きょうは はやく かえります。","I'm going home early today."],
    [11,"ぜんぶで","ぜんぶで いくらですか。","How much is it altogether?"],
    [12,"いちばん","くだもので りんごが いちばん すきです。","Of all fruits, I like apples the most."],
    [12,"ずっと","でんしゃは バスより ずっと はやいです。","Trains are much faster than buses."],
    [12,"はじめて","はじめて おすしを たべました。","I ate sushi for the first time."]
  ];
  SPECIAL.push({id:"adverbs", title:"副詞 · Adverbs (with examples)", from:12,
    cards:ADV.map(([L,k,x,xe])=>{const w=find(L,k);return w?{...w,x,xe,id:`sp:adv:${k}`}:null}).filter(Boolean)});
  SPECIAL.push({id:"particles", title:"助詞 · Particle review", from:13,
    cards:PARTICLES.map((p,i)=>({t:"part",...p,L:"1–13",id:`sp:part:${i}`}))});
  SPECIAL.forEach(d=>{d.level=levelOfLesson(d.from)});
}
const FORM_LABEL={neg:"Negative (not ～)",past:"Past (was ～)",pastneg:"Past negative (was not ～)"};
function conjFront(w){
  const m=w.base.kanji||w.base.kana;
  return `<div class="pill">${FORM_LABEL[w.form]}</div><div class="jpmain ${[...m].length<=5?"lg":"md"}">${m}</div>`+(w.base.kanji?`<div class="kana">${w.base.kana}</div>`:"")+`<div class="note">${w.e}</div>`;
}
function conjBack(w){
  const m=w.ans.kanji||w.ans.kana;
  return `<div class="pill">${FORM_LABEL[w.form]}</div><div class="jpmain ${[...m].length<=6?"lg":"md"}">${m}</div>`+(w.ans.kanji?`<div class="kana">${w.ans.kana}</div>`:"")+`<div class="romaji">${toRomaji(w.ans.kana)}</div>`;
}
function partFront(w){
  return `<div class="pill">Which particle?</div><div class="sent">${w.s.replace("（　）",'<span class="blank">？</span>')}</div><div class="exe">${w.e}</div>`;
}
function partBack(w){
  return `<div class="pill">Answer</div><div class="jpmain xl">${w.a}</div><div class="sent">${w.s.replace("（　）",`<span class="fill">${w.a}</span>`)}</div>`+(w.n?`<div class="note">${w.n}</div>`:"");
}

/* ===== App ===== */
const $=id=>document.getElementById(id);
let mode="EJ", deck=[], idx=0, known=new Set(), again=[], flipped=false;

function jpFace(w){
  const main=w.j||w.k, len=[...main].length;
  const size=len<=4?"xl":len<=8?"lg":"md";
  const ro=`<div class="romaji">${w.r||toRomaji(w.k)}</div>`;
  const ex=w.x?`<div class="ex">${w.x}</div>`:"";
  return `<div class="jpmain ${size}">${main}</div>`+(w.j?`<div class="kana${[...w.k].length>10?" long":""}">${w.k}</div>`:"")+ro+ex;
}
function enFace(w){return `<div class="en${w.e.length>22?" long":""}">${w.e}</div>`+(w.n?`<div class="note">${w.n}</div>`:"")+(w.xe?`<div class="exe">${w.xe}</div>`:"")}

function render(){
  if(idx>=deck.length){return finish()}
  $("done").hidden=true;$("locked").hidden=true;$("study").hidden=false;
  const w=deck[idx];
  $("card").classList.remove("flipped");flipped=false;
  setTimeout(()=>{
    const tag=$("lesson").value==="mada"?`<div class="tag">${w.t==="conj"?"Adjectives":w.t==="part"?"Particles":"Lesson "+w.L}</div>`:"";
    let F,B;
    if(w.t==="conj"){F=conjFront(w);B=conjBack(w)}
    else if(w.t==="part"){F=partFront(w);B=partBack(w)}
    else{F=mode==="JE"?jpFace(w):enFace(w);B=mode==="JE"?enFace(w):jpFace(w)}
    $("front").innerHTML=tag+F+`<div class="hint">tap to flip</div>`;
    $("back").innerHTML=B;
  }, $("card").classList.contains("flipped")?250:0);
  $("count").textContent=`${idx+1} / ${deck.length}`;
  $("barfill").style.width=`${idx/deck.length*100}%`;
  $("known").textContent=`✓ ${known.size}`;
}
function flip(){flipped=!flipped;$("card").classList.toggle("flipped",flipped)}
/* "Still learning" list — saved on this device, kept across lessons and visits */
const STORE_KEY=`kotoba-${SITE_ID}-mada`;
let mada=new Set();
try{mada=new Set(JSON.parse(localStorage.getItem(STORE_KEY)||"[]"))}catch(e){}
function saveMada(){try{localStorage.setItem(STORE_KEY,JSON.stringify([...mada]))}catch(e){};updateMadaOption()}
function updateMadaOption(){const o=$("optMada");if(o){o.textContent=`★ My “still learning” cards (${mada.size})`;o.disabled=!mada.size}}
function madaDeck(){
  const out=[],seen=new Set();
  const add=w=>{if(mada.has(w.id)&&!seen.has(w.id)){seen.add(w.id);out.push(w)}};
  for(const L in LESSONS)if(isOpen(+L))LESSONS[L].forEach(add);
  for(const d of SPECIAL)if(d.level<=level)d.cards.forEach(add);
  return out;
}

function answer(ok){
  if(idx>=deck.length)return;
  const w=deck[idx];
  if(ok){known.add(w);mada.delete(w.id)}else{again.push(w);mada.add(w.id)}
  saveMada();
  idx++;render();
}
function finish(){
  $("study").hidden=true;$("done").hidden=false;
  $("barfill").style.width="100%";
  $("count").textContent=`${deck.length} / ${deck.length}`;
  $("known").textContent=`✓ ${known.size}`;
  $("result").textContent=again.length?`Got it: ${deck.length-again.length} · Still learning: ${again.length}`:`You got all ${deck.length} cards! すごい！`;
  $("review").hidden=!again.length;
  if($("lesson").value==="mada"&&!mada.size)$("result").textContent="Your “still learning” list is empty. すごい！";
}
function start(list){deck=list.slice();idx=0;again=[];known=new Set();render()}
function loadLesson(){
  const v=$("lesson").value;
  if(v.startsWith("sp:")){
    const d=SPECIAL.find(d=>"sp:"+d.id===v);
    if(d.level>level)return showLocked(d.from);
    const fixed=d.cards[0]&&d.cards[0].t;
    $("mJE").hidden=$("mEJ").hidden=!!fixed;
    return start(d.cards);
  }
  $("mJE").hidden=$("mEJ").hidden=false;
  if(v!=="mada"&&!isOpen(+v))return showLocked(+v);
  start(v==="mada"?madaDeck():(LESSONS[v]||[]));
}
function showLocked(n){
  const L=LESSONS[n]?LEVELS[levelOfLesson(n)]:LEVELS[levelOfLesson(n)];
  $("study").hidden=true;$("done").hidden=true;$("locked").hidden=false;
  $("lockTitle").textContent=`Lesson ${n} is locked`;
  $("lockText").innerHTML=`Lessons ${L.from}–${L.to} are part of <b>${L.name}</b>.<br>Ask your teacher for the password to unlock the next level!`;
  $("count").textContent="";$("known").textContent="";$("barfill").style.width="0";
  $("pw2").value="";$("err2").textContent="";
}
function tryUnlock2(){
  const lv=levelFromPw($("pw2").value);
  if(lv<0){$("err2").textContent="Wrong password. Please try again.";return}
  if(lv<=level){$("err2").textContent="This password is for a level you already have.";return}
  setLevel(lv);buildMenu();loadLesson();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function setMode(m){mode=m;$("mJE").classList.toggle("on",m==="JE");$("mEJ").classList.toggle("on",m==="EJ");render()}

function init(){
  for(const L in LESSONS)LESSONS[L].forEach(w=>{w.id=`${L}:${w.k}|${w.e}`;w.L=L});
  buildSpecial();
  buildMenu();
  $("lesson").value="1";
  $("unlock2").onclick=tryUnlock2;
  $("pw2").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock2()});
  $("lesson").onchange=loadLesson;
  $("mJE").onclick=()=>setMode("JE");$("mEJ").onclick=()=>setMode("EJ");
  $("shuffle").onclick=()=>start(shuffle(deck.slice()));
  $("scene").onclick=flip;
  $("again").onclick=()=>answer(false);$("good").onclick=()=>answer(true);
  $("review").onclick=()=>start(again);
  $("restart").onclick=loadLesson;
  document.addEventListener("keydown",e=>{
    if($("app").hidden||$("study").hidden||e.target.tagName==="INPUT")return;
    if(e.code==="Space"){e.preventDefault();flip()}
    if(e.key==="ArrowLeft")answer(false);
    if(e.key==="ArrowRight")answer(true);
  });
  loadLesson();
}

function buildMenu(){
  const sel=$("lesson"),cur=sel.value;sel.innerHTML="";
  const om=document.createElement("option");om.value="mada";om.id="optMada";sel.appendChild(om);
  updateMadaOption();
  LEVELS.forEach((L,li)=>{
    const g=document.createElement("optgroup");
    g.label=li<=level?`${L.name}  (Lessons ${L.from}–${L.to})`:`🔒 ${L.name}  (Lessons ${L.from}–${L.to})`;
    for(let i=L.from;i<=L.to;i++){
      const o=document.createElement("option");o.value=i;
      if(li>level)o.textContent=`🔒 Lesson ${i}`;
      else if(!LESSONS[i]){o.textContent=`Lesson ${i} (coming soon)`;o.disabled=true}
      else o.textContent=`Lesson ${i}`;
      g.appendChild(o);
    }
    sel.appendChild(g);
    const decks=SPECIAL.filter(d=>d.level===li);
    if(decks.length){
      const sg=document.createElement("optgroup");
      sg.label=`${li<=level?"":"🔒 "}✨ ${L.name} Special practice`;
      for(const d of decks){
        const o=document.createElement("option");o.value="sp:"+d.id;
        o.textContent=(li>level?"🔒 ":"")+d.title;sg.appendChild(o);
      }
      sel.appendChild(sg);
    }
  });
  if(cur)sel.value=cur;
  $("levelBadge").textContent=`Your level: ${LEVELS[level].name} · Lessons ${LEVELS[0].from}–${LEVELS[level].to}`;
}
function setLevel(lv){level=lv;try{localStorage.setItem(`kotoba-${SITE_ID}-level`,LEVELS[lv].hash)}catch(e){}}

document.title=`ことばカード ${SITE_NAME}`;
document.querySelectorAll("#siteName,.siteName").forEach(e=>e.textContent=SITE_NAME);

/* ===== Lock ===== */
function unlock(){$("lock").remove();$("app").hidden=false;init()}
function tryPw(){
  const lv=levelFromPw($("pw").value);
  if(lv>=0){setLevel(lv);unlock()}
  else{$("err").textContent="Wrong password. Please try again."}
}
$("enter").onclick=tryPw;
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryPw()});
try{const h=localStorage.getItem(`kotoba-${SITE_ID}-level`);const lv=LEVELS.findIndex(l=>l.hash===h);if(lv>=0){level=lv;unlock()}}catch(e){}
</script>
</body>
